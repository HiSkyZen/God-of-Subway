name: Source Snapshot

on:
  pull_request:
    branches: [dev/ts-bun]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: |
          bun install --frozen-lockfile
          cp "$(command -v bun)" ./bun-linux-x64
          git clone --depth 1 https://github.com/unending314/God-of-Subway.git ./_upstream
      - uses: actions/upload-artifact@v4
        with:
          name: source-tree-with-runtime-and-upstream
          path: |
            .
            node_modules
            bun-linux-x64
            _upstream/transfer_data.json
            _upstream/engine.py
            _upstream/tests
          include-hidden-files: true
          retention-days: 1
