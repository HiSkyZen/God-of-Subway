name: bounded-search-lrt

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  mission:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/transit-routing-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 8
      - name: Verify source identity
        shell: bash
        run: git merge-base --is-ancestor 4d016ee0c624e099d4a4035372a6a9716aaf6177 HEAD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Apply bounded mission
        run: python3 scripts/mission-search-lrt.py
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Verify targeted regressions
        run: bun test tests/client/station-suggestions.test.ts tests/engine/urban-lines.test.ts tests/engine/transit-routing-overhaul.test.ts tests/engine/regression-routes.test.ts
      - name: Build
        run: bun run build:all
      - name: Verify PWA
        run: bun run verify:pwa
      - name: Verify AOT
        run: bun run verify:aot
      - name: Inspect and publish durable result
        shell: bash
        run: |
          git diff --check
          test ! -e scripts/mission-search-lrt.py
          test ! -e .github/workflows/mission-search-lrt.yml
          ! grep -R -n --exclude-dir=.git -E '🔵|🟢|🟠|🔷|🟣|🟤|🟩|🩷|🟡|🟪' src/client/station-suggestions.ts
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "mission produced no changes"; exit 1; }
          git commit -m "feat: refine station search and add light rail timetables"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
