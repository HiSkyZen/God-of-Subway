name: Apply bounded KRIC fallback patch

on:
  push:
    branches: [feat/sqlite-transit-data]
    paths: [.github/workflows/apply-live-fallback.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/sqlite-transit-data
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Patch bounded discovery and source/day fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/transit-build/timetable.ts')
          s = p.read_text()
          s = s.replace(
            '  const probes = job.stations.slice(0, Math.min(2, job.stations.length));',
            '''  const probeIndexes = [Math.floor(job.stations.length / 2), 0, job.stations.length - 1];
            const probes = [...new Set(probeIndexes)]
              .filter((index) => index >= 0 && index < job.stations.length)
              .map((index) => job.stations[index]);''',
          )
          s = s.replace(
            '        const rows = await requestRows(endpoint.id, job, ref, 0);',
            '        const rows = await requestRows(endpoint.id, job, ref, 1);',
          )
          old = '''    if (!plan.endpoint) {
              console.warn(`[build:data][kric-endpoint-discovery-failure] ${JSON.stringify({
                type: "kric_timetable_endpoint_discovery_failure",
                source_id: plan.job.source.source_id,
                day: plan.job.day,
              })}`);
            }
            const probedCodes = new Set(plan.probeRows.map((probe) => probe.ref.station.station_code));'''
          new = '''    if (!plan.endpoint) {
              console.warn(`[build:data][kric-endpoint-discovery-failure] ${JSON.stringify({
                type: "kric_timetable_endpoint_discovery_failure",
                source_id: plan.job.source.source_id,
                day: plan.job.day,
              })}`);
              continue;
            }
            const probedCodes = new Set(plan.probeRows.map((probe) => probe.ref.station.station_code));'''
          if old not in s:
              raise SystemExit('endpoint discovery block did not match')
          s = s.replace(old, new)
          s = s.replace('        endpoint: plan.endpoint ?? "station",', '        endpoint: plan.endpoint,')
          p.write_text(s)

          p = Path('scripts/build-transit-db.ts')
          s = p.read_text()
          marker = 'import { deriveRideEdges, loadLiveTimetables } from "./transit-build/timetable";'
          if 'timetable-fallback' not in s:
              s = s.replace(marker, marker + '\nimport { loadMissingDefaultTimetables } from "./transit-build/timetable-fallback";')
          old = '''  } else {
            await loadLiveTimetables(db, sources, stations);
            const hints = await loadKricTransferLocationHints(db, sources, stations);'''
          new = '''  } else {
            await loadLiveTimetables(db, sources, stations);
            loadMissingDefaultTimetables(db, sources, stations);
            const hints = await loadKricTransferLocationHints(db, sources, stations);'''
          if old not in s:
              raise SystemExit('live builder block did not match')
          p.write_text(s.replace(old, new))
          PY

          cat > scripts/transit-build/timetable-fallback.ts <<'TS'
          import { Database } from "bun:sqlite";
          import type { TransitServiceDay } from "../../src/infra/transit-schema";
          import { buildSource, cleanName, metadata, type Event, type SourceRow, type StationRow } from "./common";
          import { insertTrip } from "./timetable";

          interface PathStation extends StationRow { stationId: number; }
          export interface TimetableFallbackTarget { sourceId: string; line: string; day: "DAY" | "END"; }
          export interface TimetableFallbackStats { targets: TimetableFallbackTarget[]; generatedTrips: number; saturdayTrips: number; }

          function sourceTripCount(db: Database, sourceId: string, day: TransitServiceDay): number {
            return Number((db.query(`SELECT COUNT(DISTINCT t.trip_id) AS n FROM trip t JOIN trip_source ts ON ts.trip_id=t.trip_id WHERE ts.source_id=? AND t.service_day=?`).get(sourceId, day) as { n: number } | null)?.n ?? 0);
          }

          function sourcePath(db: Database, source: SourceRow, stations: StationRow[]): PathStation[] {
            return stations.filter((station) => station.source_id === source.source_id)
              .sort((a, b) => Number(a.sequence_hint) - Number(b.sequence_hint))
              .map((station) => {
                const row = db.query(`SELECT station_id FROM station_source WHERE source_id=? AND station_code=?`).get(source.source_id, station.station_code) as { station_id: number } | null;
                return row ? { ...station, stationId: Number(row.station_id) } : null;
              }).filter((station): station is PathStation => station !== null);
          }

          function fallbackEvents(source: SourceRow, path: PathStation[], day: "DAY" | "END", trainNo: string, start: number, reverse: boolean): Event[] {
            const ordered = reverse ? [...path].reverse() : path;
            return ordered.map((station, index) => {
              const sec = start + index * 90;
              return { sourceId: source.source_id, line: source.logical_line, day, trainNo, stationId: station.stationId, stationCode: station.station_code, station: cleanName(station.canonical_name), arrival: index === 0 ? null : sec, departure: index === ordered.length - 1 ? null : sec + 20, sequenceHint: Number(station.sequence_hint || 0), rawKind: "local" };
            });
          }

          function generateSourceDay(db: Database, source: SourceRow, path: PathStation[], day: "DAY" | "END"): number {
            const prefix = source.source_id.replace(/[^A-Za-z0-9]/g, "");
            for (let index = 0; index < 24; index += 1) {
              const reverse = index % 2 === 1;
              const trainNo = `FB-${prefix}-${day}-${String(index + 1).padStart(3, "0")}`;
              const events = fallbackEvents(source, path, day, trainNo, 5 * 3600 + 30 * 60 + index * 45 * 60, reverse);
              insertTrip(db, source.logical_line, day, trainNo, reverse ? "UP" : "DOWN", "local", [source.source_id], events);
            }
            return 24;
          }

          export function synchronizeSaturdayFromEnd(db: Database): number {
            const endTrips = db.query(`SELECT trip_id,logical_line,train_no,direction,service_kind,service_priority,origin_station_id,destination_station_id FROM trip WHERE service_day='END' ORDER BY trip_id`).all() as Array<{ trip_id:number; logical_line:string; train_no:string; direction:string; service_kind:string; service_priority:number; origin_station_id:number|null; destination_station_id:number|null }>;
            const sourceRows = db.prepare(`SELECT source_id FROM trip_source WHERE trip_id=? ORDER BY source_id`);
            const stopRows = db.prepare(`SELECT stop_sequence,station_id,arrival_sec,departure_sec,callable,source_station_code FROM stop_time WHERE trip_id=? ORDER BY stop_sequence`);
            const insertTripRow = db.prepare(`INSERT INTO trip(logical_line,service_day,train_no,direction,service_kind,service_priority,origin_station_id,destination_station_id) VALUES (?,'SAT',?,?,?,?,?,?)`);
            const insertSource = db.prepare(`INSERT INTO trip_source(trip_id,source_id) VALUES (?,?)`);
            const insertStop = db.prepare(`INSERT INTO stop_time(trip_id,stop_sequence,station_id,arrival_sec,departure_sec,callable,source_station_code) VALUES (?,?,?,?,?,?,?)`);
            db.transaction(() => {
              db.query(`DELETE FROM trip WHERE service_day='SAT'`).run();
              for (const trip of endTrips) {
                insertTripRow.run(trip.logical_line, trip.train_no, trip.direction, trip.service_kind, trip.service_priority, trip.origin_station_id, trip.destination_station_id);
                const satId = Number((db.query(`SELECT trip_id FROM trip WHERE logical_line=? AND service_day='SAT' AND train_no=?`).get(trip.logical_line, trip.train_no) as { trip_id:number }).trip_id);
                for (const row of sourceRows.all(trip.trip_id) as Array<{source_id:string}>) insertSource.run(satId, row.source_id);
                for (const row of stopRows.all(trip.trip_id) as Array<{stop_sequence:number;station_id:number;arrival_sec:number|null;departure_sec:number|null;callable:number;source_station_code:string}>) insertStop.run(satId,row.stop_sequence,row.station_id,row.arrival_sec,row.departure_sec,row.callable,row.source_station_code);
              }
            })();
            metadata(db, "sat_schedule_source", "END(dayCd=9):database-exact-clone");
            return endTrips.length;
          }

          export function loadMissingDefaultTimetables(db: Database, sources: SourceRow[], stations: StationRow[]): TimetableFallbackStats {
            const targets: TimetableFallbackTarget[] = [];
            let generatedTrips = 0;
            for (const source of sources) {
              if (source.timetable === "0") continue;
              const path = sourcePath(db, source, stations);
              if (path.length < 2) continue;
              for (const day of ["DAY", "END"] as const) {
                if (sourceTripCount(db, source.source_id, day) > 0) continue;
                const generated = generateSourceDay(db, source, path, day);
                generatedTrips += generated;
                targets.push({ sourceId: source.source_id, line: source.logical_line, day });
                console.warn(`[build:data][timetable-fallback] ${JSON.stringify({ type: "default_timetable_fallback", source_id: source.source_id, line: source.logical_line, day, generated_trips: generated })}`);
              }
            }
            const saturdayTrips = synchronizeSaturdayFromEnd(db);
            metadata(db, "default_timetable_fallback_source_days", targets.length);
            metadata(db, "default_timetable_fallback_targets", JSON.stringify(targets));
            buildSource(db, "default-timetable-fallback", "generated:station-registry-backup", generatedTrips, `KRIC-missing source/day only; targets=${JSON.stringify(targets)}`);
            return { targets, generatedTrips, saturdayTrips };
          }
          TS

          cat > tests/engine/timetable-fallback.test.ts <<'TS'
          import { describe, expect, test } from "bun:test";
          import { Database } from "bun:sqlite";
          import { TRANSIT_SCHEMA_SQL } from "../../src/infra/transit-schema";
          import type { Event, SourceRow, StationRow } from "../../scripts/transit-build/common";
          import { loadMissingDefaultTimetables } from "../../scripts/transit-build/timetable-fallback";
          import { insertTrip } from "../../scripts/transit-build/timetable";

          const source: SourceRow = { source_id:"test-source", logical_line:"2호선", operator_code:"T", operator_name:"test", line_code:"2", source_line_name:"2호선", section:"", realtime:"0", timetable:"1", priority:"1" };
          const stations: StationRow[] = [1,2,3].map((index) => ({ source_id:source.source_id, station_code:`S${index}`, source_station_name:`역${index}`, canonical_name:`역${index}`, sequence_hint:String(index) }));
          function makeDb(): Database {
            const db = new Database(":memory:", { strict:true }); db.exec(TRANSIT_SCHEMA_SQL);
            db.query(`INSERT INTO source_registry(source_id,logical_line,operator_code,operator_name,line_code,source_line_name,realtime,timetable,section,priority) VALUES (?,?,?,?,?,?,?,?,?,?)`).run(source.source_id,source.logical_line,source.operator_code,source.operator_name,source.line_code,source.source_line_name,0,1,"",1);
            stations.forEach((station,index) => { const id=index+1; db.query(`INSERT INTO station(station_id,station_key,canonical_name,display_name) VALUES (?,?,?,?)`).run(id,`T:${index}`,station.canonical_name,station.canonical_name); db.query(`INSERT INTO station_source(source_id,station_code,station_id,source_station_name,sequence_hint) VALUES (?,?,?,?,?)`).run(source.source_id,station.station_code,id,station.source_station_name,index+1); });
            return db;
          }
          function kricEvents(): Event[] { return stations.map((station,index) => ({ sourceId:source.source_id,line:source.logical_line,day:"DAY" as const,trainNo:"KRIC-001",stationId:index+1,stationCode:station.station_code,station:station.canonical_name,arrival:index===0?null:21600+index*120,departure:index===2?null:21620+index*120,sequenceHint:index+1,rawKind:"local" })); }

          describe("KRIC-missing timetable fallback", () => {
            test("fills only missing source days and clones SAT exactly", () => { const db=makeDb(); try { const stats=loadMissingDefaultTimetables(db,[source],stations); expect(stats.targets).toEqual([{sourceId:"test-source",line:"2호선",day:"DAY"},{sourceId:"test-source",line:"2호선",day:"END"}]); expect(Number((db.query(`SELECT COUNT(*) AS n FROM trip WHERE service_day='SAT'`).get() as {n:number}).n)).toBe(24); expect(Number((db.query(`SELECT COUNT(*) AS n FROM trip WHERE service_day='END'`).get() as {n:number}).n)).toBe(24); } finally { db.close(); } });
            test("keeps available KRIC weekday and fills only missing END", () => { const db=makeDb(); try { insertTrip(db,"2호선","DAY","KRIC-001","DOWN","local",[source.source_id],kricEvents()); const stats=loadMissingDefaultTimetables(db,[source],stations); expect(stats.targets).toEqual([{sourceId:"test-source",line:"2호선",day:"END"}]); expect(Number((db.query(`SELECT COUNT(*) AS n FROM trip WHERE service_day='DAY' AND train_no LIKE 'FB-%'`).get() as {n:number}).n)).toBe(0); } finally { db.close(); } });
          });
          TS

      - name: Validate product patch
        run: |
          bun install --frozen-lockfile
          TRANSIT_DATA_MODE=fixture bun run build:data
          bun run doctor
          bun run typecheck
          bun test tests/engine/timetable-fallback.test.ts tests/engine/timetable-service-kind.test.ts tests/engine/data-repository.test.ts tests/engine/rapid-service.test.ts

      - name: Commit product change and self-delete
        shell: bash
        run: |
          rm .github/workflows/apply-live-fallback.yml
          git add scripts/transit-build/timetable.ts scripts/transit-build/timetable-fallback.ts scripts/build-transit-db.ts tests/engine/timetable-fallback.test.ts .github/workflows/apply-live-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(data): bound KRIC source failures with targeted fallback"
          git push origin HEAD:feat/sqlite-transit-data
