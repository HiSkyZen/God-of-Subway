name: Apply KRIC resilience patch

on:
  push:
    branches: [feat/sqlite-transit-data]
    paths: [.github/workflows/apply-kric-resilience.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/sqlite-transit-data
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply validated source patch
        shell: bash
        run: |
          test "$(git hash-object scripts/transit-build/timetable.ts)" = "ce664f38e847a886ac8050ac5bb410f0c1a7af8b"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/transit-build/timetable.ts')
          s=p.read_text()
          s=s.replace('  ALLOW_PARTIAL,\n','')
          s=s.replace('''type StationResult = {\n  job: StationJob;\n  rows: ApiRow[];\n  endpoint: EndpointId | null;\n  requests: number;\n};''','''type StationResult = {\n  job: StationJob;\n  rows: ApiRow[];\n  endpoint: EndpointId | null;\n  requests: number;\n  failed: boolean;\n};''')
          s=s.replace('''      if (rows.length) return { job, rows, endpoint, requests };''','''      if (rows.length) return { job, rows, endpoint, requests, failed: false };''')
          s=s.replace('''  if (errors.length === ordered.length && !ALLOW_PARTIAL) {\n    throw new Error(\n      `KRIC 시간표 요청 실패: ${job.source.source_id}/${job.ref.station.station_code}/${job.day}: ${errors.join("; ")}`,\n    );\n  }\n  return { job, rows: [], endpoint: null, requests };''','''  const failed = errors.length === ordered.length;\n  if (failed) {\n    console.warn(`[build:data][kric-station-failure] ${JSON.stringify({\n      type: "kric_timetable_station_failure",\n      source_id: job.source.source_id,\n      station_code: job.ref.station.station_code,\n      day: job.day,\n      endpoints: errors,\n    })}`);\n  }\n  return { job, rows: [], endpoint: null, requests, failed };''')
          old='''function inferServiceKinds(events: Map<string, Event[]>): Map<string, "local" | "express" | "direct"> {\n  const kinds = new Map<string, "local" | "express" | "direct">();\n  for (const [key, group] of events) {\n    const [line, , trainNo] = key.split("\\u0001");'''
          new='''function inferServiceKinds(\n  events: Map<string, Event[]>,\n  unavailableSequences: ReadonlyMap<string, ReadonlySet<number>> = new Map(),\n): Map<string, "local" | "express" | "direct"> {\n  const kinds = new Map<string, "local" | "express" | "direct">();\n  for (const [key, group] of events) {\n    const [line, day, trainNo] = key.split("\\u0001");'''
          assert old in s
          s=s.replace(old,new)
          old='''    const bySource = new Map<string, Event[]>();\n    for (const event of group) bySource.set(event.sourceId, [...(bySource.get(event.sourceId) ?? []), event]);\n    for (const sourceEvents of bySource.values()) {\n      const seq = [...new Set(sourceEvents.map((event) => event.sequenceHint).filter(Number.isFinite))].sort((a, b) => a - b);\n      if (seq.some((value, index) => index > 0 && value - seq[index - 1] > 1)) { express = true; break; }\n    }'''
          new='''    const bySource = new Map<string, Event[]>();\n    for (const event of group) bySource.set(event.sourceId, [...(bySource.get(event.sourceId) ?? []), event]);\n    for (const [sourceId, sourceEvents] of bySource) {\n      const seq = [...new Set(sourceEvents.map((event) => event.sequenceHint).filter(Number.isFinite))].sort((a, b) => a - b);\n      const unavailable = unavailableSequences.get(`${sourceId}\\u0001${day}`);\n      const reliableGap = seq.some((value, index) => {\n        if (index === 0) return false;\n        const previous = seq[index - 1];\n        if (value - previous <= 1) return false;\n        for (let missing = previous + 1; missing < value; missing += 1) {\n          if (unavailable?.has(missing)) return false;\n        }\n        return true;\n      });\n      if (reliableGap) { express = true; break; }\n    }'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('''  for (const plan of plans) {\n    if (!plan.endpoint) continue;\n    const probedCodes = new Set(plan.probeRows.map((probe) => probe.ref.station.station_code));''','''  for (const plan of plans) {\n    if (!plan.endpoint) {\n      console.warn(`[build:data][kric-endpoint-discovery-failure] ${JSON.stringify({\n        type: "kric_timetable_endpoint_discovery_failure",\n        source_id: plan.job.source.source_id,\n        day: plan.job.day,\n      })}`);\n    }\n    const probedCodes = new Set(plan.probeRows.map((probe) => probe.ref.station.station_code));''')
          s=s.replace('''        endpoint: plan.endpoint,\n      });''','''        endpoint: plan.endpoint ?? "station",\n      });''')
          old='''  const stationRequests = stationResults.reduce((sum, result) => sum + result.requests, 0);\n  for (const result of stationResults) {'''
          new='''  const stationRequests = stationResults.reduce((sum, result) => sum + result.requests, 0);\n  const unavailableSequences = new Map<string, Set<number>>();\n  for (const result of stationResults) {\n    if (result.failed) {\n      for (const day of result.job.day === "END" ? (["END", "SAT"] as const) : ([result.job.day] as const)) {\n        const failureKey = `${result.job.source.source_id}\\u0001${day}`;\n        const unavailable = unavailableSequences.get(failureKey) ?? new Set<number>();\n        unavailable.add(Number(result.job.ref.station.sequence_hint || 0));\n        unavailableSequences.set(failureKey, unavailable);\n      }\n    }'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('''  const inferredKinds = inferServiceKinds(events);''','''  const inferredKinds = inferServiceKinds(events, unavailableSequences);''')
          s=s.replace('''  metadata(db, "kric_timetable_requests", discoveryRequests + stationRequests);\n  metadata(db, "kric_timetable_concurrency", TIMETABLE_CONCURRENCY);''','''  metadata(db, "kric_timetable_requests", discoveryRequests + stationRequests);\n  metadata(db, "kric_timetable_concurrency", TIMETABLE_CONCURRENCY);\n  metadata(db, "kric_timetable_station_failures", stationResults.filter((result) => result.failed).length);''')
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          bun install --frozen-lockfile
          TRANSIT_DATA_MODE=fixture bun run build:data
          bun run typecheck
          bun test tests/engine/timetable-service-kind.test.ts tests/engine/data-repository.test.ts tests/engine/rapid-service.test.ts
      - name: Commit product change and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/apply-kric-resilience.yml
          git add scripts/transit-build/timetable.ts .github/workflows/apply-kric-resilience.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(data): tolerate transient KRIC station failures"
          git push origin HEAD:feat/sqlite-transit-data
