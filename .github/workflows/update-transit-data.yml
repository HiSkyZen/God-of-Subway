name: Transit Data Update

on:
  schedule:
    # 03:00 Asia/Seoul = 18:00 UTC on the previous date.
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - dev/ts-bun
      - feat/sqlite-transit-data
    paths:
      - .github/workflows/update-transit-data.yml
      - scripts/transit-build/**
      - scripts/build-transit-db.ts
      - scripts/verify-live-transit.ts
      - datasets/**

permissions:
  contents: write

concurrency:
  group: transit-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KRIC_API_KEY: ${{ secrets.KRIC_API_KEY }}
      TRANSIT_DATA_MODE: live
      TRANSIT_BUILD_CONCURRENCY: "96"
      TRANSIT_BUILD_KRIC_HTTP_CONCURRENCY: "96"
      TRANSIT_BUILD_HTTP_TIMEOUT_MS: "30000"
      TRANSIT_BUILD_KRIC_RETRIES: "10"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Require KRIC credential
        shell: bash
        run: |
          if [ -z "$KRIC_API_KEY" ]; then
            echo "KRIC_API_KEY repository secret is required for the daily live timetable refresh." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build complete KRIC SQLite and stage partial candidate on failure
        id: build
        shell: bash
        run: |
          rm -f \
            data/transit.refresh-candidate.sqlite \
            data/transit.refresh-candidate.sqlite-wal \
            data/transit.refresh-candidate.sqlite-shm \
            data/transit.pending.sqlite \
            data/transit.pending.sqlite-wal \
            data/transit.pending.sqlite-shm

          set +e
          timeout --signal=TERM --kill-after=30s 35m bash -c '
            set -e
            TRANSIT_BUILD_ALLOW_PARTIAL=true TRANSIT_DB_PATH=data/transit.refresh-candidate.sqlite bun run build:data
            TRANSIT_DB_PATH=data/transit.refresh-candidate.sqlite bun run scripts/verify-live-transit.ts
            TRANSIT_DB_PATH=data/transit.refresh-candidate.sqlite bun run doctor
            TRANSIT_DB_PATH=data/transit.refresh-candidate.sqlite bun run audit:transfers
          ' 2>&1 | tee /tmp/transit-live.log
          live_rc=${PIPESTATUS[0]}
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          prefix = '[build:data][kric-station-failure] '
          units = []
          seen = set()
          for line in Path('/tmp/transit-live.log').read_text(errors='replace').splitlines():
              pos = line.find(prefix)
              if pos < 0:
                  continue
              try:
                  payload = json.loads(line[pos + len(prefix):])
              except Exception:
                  continue
              unit = {
                  'source_id': str(payload.get('source_id', '')).strip(),
                  'station_code': str(payload.get('station_code', '')).strip(),
                  'day': str(payload.get('day', '')).strip(),
              }
              key = (unit['source_id'], unit['station_code'], unit['day'])
              if not all(key) or unit['day'] not in ('DAY', 'END') or key in seen:
                  continue
              seen.add(key)
              units.append(unit)
          Path('/tmp/transit-failed-units.json').write_text(json.dumps(units, ensure_ascii=False))
          PY

          failed_count=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(len(json.loads(Path('/tmp/transit-failed-units.json').read_text())))
          PY
          )

          source=live
          fallback=none
          if [ "$live_rc" -eq 0 ]; then
            mv data/transit.refresh-candidate.sqlite data/transit.sqlite
            rm -f data/transit.pending.sqlite data/transit-refresh-failure.json
          else
            if [ -f data/transit.refresh-candidate.sqlite ] && [ "$failed_count" -gt 0 ]; then
              mv data/transit.refresh-candidate.sqlite data/transit.pending.sqlite
              source=partial
              echo "::warning::KRIC live build has ${failed_count} failed timetable units; preserving the partial live SQLite for targeted deploy-time retry."
            else
              rm -f data/transit.refresh-candidate.sqlite data/transit.refresh-candidate.sqlite-wal data/transit.refresh-candidate.sqlite-shm
              source=previous
              echo "::warning::KRIC live build failed without a retryable partial candidate."
            fi

            if [ -f data/transit.sqlite ]; then
              fallback=previous
              echo "::warning::Preserving last-known-good transit.sqlite as the deploy fallback."
            else
              fallback=fixture
              echo "::warning::No last-known-good SQLite exists; bootstrapping deterministic fixture fallback."
              TRANSIT_DATA_MODE=fixture TRANSIT_DB_PATH=data/transit.sqlite bun run build:data
              if [ "$source" = "previous" ]; then source=fallback; fi
            fi

            python3 - "$source" "$fallback" <<'PY'
          import json, re, sys
          from pathlib import Path

          source, fallback = sys.argv[1:3]
          units = json.loads(Path('/tmp/transit-failed-units.json').read_text())
          lines = Path('/tmp/transit-live.log').read_text(errors='replace').splitlines()
          keep = []
          for line in lines:
              if '[build:data]' not in line and 'KRIC' not in line and '시간표' not in line and 'Error' not in line:
                  continue
              line = re.sub(r'(serviceKey=)[^&\s]+', r'\1REDACTED', line)
              keep.append(line[:1200])
          Path('data').mkdir(exist_ok=True)
          Path('data/transit-refresh-failure.json').write_text(json.dumps({
              'type': 'transit_refresh_failure',
              'fallback': fallback,
              'pending_candidate': source == 'partial',
              'failed_timetable_units': units if source == 'partial' else [],
              'timetable_retries': 10,
              'build_concurrency': 96,
              'http_concurrency': 96,
              'http_timeout_ms': 30000,
              'retry_delay_ms': 0,
              'log_tail': keep[-120:],
          }, ensure_ascii=False, indent=2) + '\n')
          PY
          fi

          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"
          echo "failed_count=$failed_count" >> "$GITHUB_OUTPUT"
          echo "live_rc=$live_rc" >> "$GITHUB_OUTPUT"

      - name: Validate selected fallback or live database
        run: |
          bun run doctor
          bun run audit:transfers
          bun test

      - name: Commit validated database and retry state
        shell: bash
        run: |
          git add -f data/transit.sqlite
          if [ -f data/transit.pending.sqlite ]; then
            git add -f data/transit.pending.sqlite
          else
            git rm -f --ignore-unmatch data/transit.pending.sqlite >/dev/null 2>&1 || true
          fi
          if [ -f data/transit-refresh-failure.json ]; then
            git add -f data/transit-refresh-failure.json
          else
            git rm -f --ignore-unmatch data/transit-refresh-failure.json >/dev/null 2>&1 || true
          fi
          if git diff --cached --quiet; then
            echo "transit data and retry state are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "${{ steps.build.outputs.source }}" in
            live) message="data: refresh KRIC transit SQLite [skip ci]" ;;
            partial) message="data: stage partial KRIC SQLite for deploy retry [skip ci]" ;;
            fallback) message="data: bootstrap fallback transit SQLite [skip ci]" ;;
            *) message="data: preserve transit SQLite after KRIC refresh failure [skip ci]" ;;
          esac
          git commit -m "$message"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report partial or failed refresh
        if: steps.build.outputs.source != 'live'
        run: |
          if [ "${{ steps.build.outputs.source }}" = "partial" ]; then
            echo "KRIC live refresh completed with ${{ steps.build.outputs.failed_count }} failed timetable units. The partial live SQLite was committed for deploy-time targeted retry; LKG/fixture remains the fallback." >&2
          else
            echo "KRIC live refresh failed without a retryable partial candidate; validated LKG/fixture data was preserved." >&2
          fi
          exit 1
