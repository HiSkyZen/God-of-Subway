name: Transit Data Update

on:
  schedule:
    # 03:00 Asia/Seoul = 18:00 UTC on the previous date.
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - feat/sqlite-transit-data
    paths:
      - .github/workflows/update-transit-data.yml

permissions:
  contents: write

concurrency:
  group: transit-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KRIC_API_KEY: ${{ secrets.KRIC_API_KEY }}
      TRANSIT_DATA_MODE: live
      TRANSIT_BUILD_CONCURRENCY: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Require KRIC credential
        shell: bash
        run: |
          if [ -z "$KRIC_API_KEY" ]; then
            echo "KRIC_API_KEY repository secret is required for the daily live timetable refresh." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build new SQLite from KRIC
        run: bun run build:data

      - name: Validate generated database
        run: |
          bun run doctor
          bun run audit:transfers
          bun test tests/engine/data-repository.test.ts tests/engine/rapid-service.test.ts tests/engine/transfer-policy.test.ts

      - name: Commit only a validated changed database
        shell: bash
        run: |
          git add -f data/transit.sqlite
          if git diff --cached --quiet -- data/transit.sqlite; then
            echo "transit.sqlite is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh KRIC transit SQLite [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
