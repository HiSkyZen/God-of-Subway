name: Transit Data Update

# KRIC secret-backed verification trigger after no-delay retry hardening.
on:
  schedule:
    # 03:00 Asia/Seoul = 18:00 UTC on the previous date.
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - dev/ts-bun
      - feat/sqlite-transit-data
    paths:
      - .github/workflows/update-transit-data.yml
      - scripts/transit-build/**
      - scripts/build-transit-db.ts
      - datasets/**

permissions:
  contents: write

concurrency:
  group: transit-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KRIC_API_KEY: ${{ secrets.KRIC_API_KEY }}
      TRANSIT_DATA_MODE: live
      TRANSIT_BUILD_CONCURRENCY: "96"
      TRANSIT_BUILD_HTTP_TIMEOUT_MS: "15000"
      TRANSIT_BUILD_KRIC_RETRIES: "10"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Require KRIC credential
        shell: bash
        run: |
          if [ -z "$KRIC_API_KEY" ]; then
            echo "KRIC_API_KEY repository secret is required for the daily live timetable refresh." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build KRIC-first SQLite with bounded backup
        id: build
        shell: bash
        run: |
          rm -f data/transit.refresh-candidate.sqlite data/transit.refresh-candidate.sqlite-wal data/transit.refresh-candidate.sqlite-shm
          set +e
          TRANSIT_DB_PATH=data/transit.refresh-candidate.sqlite timeout --signal=TERM --kill-after=30s 25m bash -c 'set -e; bun run build:data; bun run scripts/verify-live-transit.ts' 2>&1 | tee /tmp/transit-live.log
          live_rc=${PIPESTATUS[0]}
          set -e

          source=live
          if [ "$live_rc" -eq 0 ]; then
            mv data/transit.refresh-candidate.sqlite data/transit.sqlite
          else
            rm -f data/transit.refresh-candidate.sqlite data/transit.refresh-candidate.sqlite-wal data/transit.refresh-candidate.sqlite-shm
            if [ -f data/transit.sqlite ]; then
              source=previous
              echo "::warning::KRIC refresh failed after 10 no-delay retries; preserving last-known-good SQLite for this scheduled run."
            else
              source=fallback
              echo "::warning::Initial KRIC refresh failed after 10 no-delay retries; bootstrapping deterministic backup SQLite."
              TRANSIT_DATA_MODE=fixture bun run build:data
            fi
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "live_rc=$live_rc" >> "$GITHUB_OUTPUT"

          if [ "$source" = "live" ]; then
            rm -f data/transit-refresh-failure.json
          else
            python3 - "$source" <<'PY'
          import json, re, sys
          from pathlib import Path
          source = sys.argv[1]
          lines = Path('/tmp/transit-live.log').read_text(errors='replace').splitlines()
          keep = []
          for line in lines:
              if '[build:data]' not in line and 'KRIC' not in line and '시간표' not in line and 'Error' not in line:
                  continue
              line = re.sub(r'(serviceKey=)[^&\s]+', r'\1REDACTED', line)
              keep.append(line[:1000])
          Path('data').mkdir(exist_ok=True)
          Path('data/transit-refresh-failure.json').write_text(json.dumps({
              'type': 'transit_refresh_failure',
              'fallback': source,
              'timetable_retries': 10,
              'concurrency': 96,
              'retry_delay_ms': 0,
              'log_tail': keep[-100:],
          }, ensure_ascii=False, indent=2) + '\n')
          PY
          fi

      - name: Validate selected database
        run: |
          bun run doctor
          bun run audit:transfers
          bun test

      - name: Commit validated database
        shell: bash
        run: |
          git add -f data/transit.sqlite
          if [ -f data/transit-refresh-failure.json ]; then
            git add -f data/transit-refresh-failure.json
          else
            git rm -f --ignore-unmatch data/transit-refresh-failure.json >/dev/null 2>&1 || true
          fi
          if git diff --cached --quiet; then
            echo "transit data is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "${{ steps.build.outputs.source }}" in
            live) message="data: refresh KRIC transit SQLite [skip ci]" ;;
            fallback) message="data: bootstrap fallback transit SQLite [skip ci]" ;;
            *) message="data: preserve transit SQLite after KRIC refresh failure [skip ci]" ;;
          esac
          git commit -m "$message"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report stale or fallback refresh
        if: steps.build.outputs.source != 'live'
        run: |
          echo "KRIC live refresh did not replace the database after 10 no-delay retries; validated backup/last-known-good data was preserved and deploy-time recovery will retry KRIC once more." >&2
          exit 1
